name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          files=$(git diff --name-only "$range")
          echo "$files"
          backend=false frontend=false
          if echo "$files" | grep -q '^\.github/'; then
            backend=true frontend=true
          else
            # Go tests drive the production voice client out of frontend/src, so
            # they run for renderer/shared changes, not only backend ones.
            echo "$files" | grep -qE '^(backend/|frontend/src/)' && backend=true
            echo "$files" | grep -q '^frontend/' && frontend=true
          fi
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"
          echo "frontend=$frontend" | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install voice-client test dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test backend
        working-directory: backend
        run: go test ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Test frontend under xvfb
        working-directory: frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          if ! ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a bun test --isolate 2>&1 | tee /tmp/bun-test.log; then
            tail -120 /tmp/bun-test.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  ci:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    env:
      BACKEND: ${{ needs.backend.result }}
      FRONTEND: ${{ needs.frontend.result }}
    steps:
      - name: Aggregate test results
        run: |
          for result in "$BACKEND" "$FRONTEND"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
