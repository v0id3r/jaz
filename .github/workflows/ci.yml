name: CI

# Tests and buildable artifacts of the fork, gated by what changed (filters
# in .github/filters.yml; web excludes the desktop-only parts that never
# enter the web bundle: src/main, native, electron.vite.config).
#   - pull_request runs the affected tests and uploads changed components as
#     workflow artifacts named with the head's short sha (sha256 attached,
#     retained for 14 days);
#   - a push to main or a jaz-* tag runs the same and release.yml publishes
#     a GitHub release from the artifacts of the completed run.
# Deploys on the host download the tarballs and verify them against the
# published sha256 files instead of building locally.
on:
  push:
    branches: [main]
    tags:
      - 'jaz-*'
  pull_request:

permissions:
  contents: read

# A newer push to main must not cancel the previous run: the release for each
# run covers everything since the last release, so a cancelled run would lose
# its components. PR runs are superseded freely.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      backend-tests: ${{ steps.filter.outputs.backend-tests }}
      web-tests: ${{ steps.filter.outputs.web-tests }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Compare a main push against the last release, not against the previous
      # commit, so every release covers everything that changed since the one
      # before it (a skipped or failed run loses nothing). No release yet, or a
      # tag push: the empty tree, i.e. every filter matches.
      - id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The repo's root commit as "beginning of time": every filter matches.
          root=$(git rev-list --max-parents=0 HEAD | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=$root" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.prerelease | not) | select(.tag_name | startswith("jaz-"))] | first | .tag_name // empty')
          if [ -n "$tag" ]; then
            git fetch -q origin "+refs/tags/$tag:refs/tags/$tag"
            echo "value=$(git rev-list -n1 "$tag")" >> "$GITHUB_OUTPUT"
          else
            echo "value=$root" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yml
          base: ${{ steps.base.outputs.value || github.base_ref }}
      - id: sha
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "sha=${sha::8}" >> "$GITHUB_OUTPUT"

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install voice-client test dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test backend
        working-directory: backend
        run: go test ./...

  frontend-test:
    needs: changes
    if: needs.changes.outputs.web-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Test frontend under xvfb
        working-directory: frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          if ! ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a bun test --isolate 2>&1 | tee /tmp/bun-test.log; then
            tail -120 /tmp/bun-test.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  build-backend:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      # Build the PR head, not the synthetic merge commit: the vcs stamp,
      # commit.txt and the artifact name must all name a commit that can
      # reach main. Tests below keep running against the merge ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Build linux-x64 backend
        working-directory: backend
        run: |
          name="jaz-backend-linux-x64"
          out="../dist/backend/$name"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-X github.com/wins/jaz/backend/internal/buildinfo.version=jaz-${GITHUB_SHA::8}" \
            -o "$out/jaz" ./cmd/jaz
          tar -C "$out" -czf "../dist/backend/$name.tar.gz" jaz
          (cd ../dist/backend && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jaz-backend-linux-x64-${{ needs.changes.outputs.sha }}
          path: |
            dist/backend/jaz-backend-linux-x64.tar.gz
            dist/backend/jaz-backend-linux-x64.tar.gz.sha256
          retention-days: 14

  build-web:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Build web client
        working-directory: frontend
        env:
          VITE_JAZ_API_URL: origin
        run: |
          bun install --frozen-lockfile
          bun run build:web
          test -f dist-web/commit.txt
          grep -q "return window.location.origin" dist-web/assets/index-*.js
          mkdir -p ../dist/backend
          tar -C dist-web -czf ../dist/backend/dist-web.tar.gz .
          (cd ../dist/backend && sha256sum dist-web.tar.gz > dist-web.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-web-${{ needs.changes.outputs.sha }}
          path: |
            dist/backend/dist-web.tar.gz
            dist/backend/dist-web.tar.gz.sha256
          retention-days: 14

