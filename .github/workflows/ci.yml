name: CI

# Tests and buildable artifacts of the fork, gated by what changed:
#   - pull_request runs the affected tests and uploads changed components as
#     workflow artifacts named with the head's short sha (sha256 attached,
#     retained for 14 days);
#   - a push to main releases jaz-<YYYYMMDD>-<shortsha> with only the
#     components that changed, listed in the notes;
#   - pushing a tag jaz-* releases that tag with both components.
# Filters live in .github/filters.yml; web excludes the desktop-only parts
# that never enter the web bundle (src/main, native, electron.vite.config).
# Deploys on the host download the tarballs and verify them against the
# published sha256 files instead of building locally.
on:
  push:
    branches: [main]
    tags:
      - 'jaz-*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      backend-tests: ${{ steps.filter.outputs.backend-tests }}
      web-tests: ${{ steps.filter.outputs.web-tests }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yml
      - id: sha
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "sha=${sha::8}" >> "$GITHUB_OUTPUT"

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install voice-client test dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test backend
        working-directory: backend
        run: go test ./...

  frontend-test:
    needs: changes
    if: needs.changes.outputs.web-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Test frontend under xvfb
        working-directory: frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          if ! ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a bun test --isolate 2>&1 | tee /tmp/bun-test.log; then
            tail -120 /tmp/bun-test.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

  build-backend:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Build linux-x64 backend
        working-directory: backend
        run: |
          name="jaz-backend-linux-x64"
          out="../dist/backend/$name"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-X github.com/wins/jaz/backend/internal/buildinfo.version=jaz-${GITHUB_SHA::8}" \
            -o "$out/jaz" ./cmd/jaz
          tar -C "$out" -czf "../dist/backend/$name.tar.gz" jaz
          sha256sum "../dist/backend/$name.tar.gz" > "../dist/backend/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jaz-backend-linux-x64-${{ needs.changes.outputs.sha }}
          path: |
            dist/backend/jaz-backend-linux-x64.tar.gz
            dist/backend/jaz-backend-linux-x64.tar.gz.sha256
          retention-days: 14

  build-web:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Build web client
        working-directory: frontend
        env:
          VITE_JAZ_API_URL: origin
        run: |
          bun install --frozen-lockfile
          bun run build:web
          test -f dist-web/commit.txt
          grep -q "return window.location.origin" dist-web/assets/index-*.js
          mkdir -p ../dist/backend
          tar -C dist-web -czf ../dist/backend/dist-web.tar.gz .
          sha256sum ../dist/backend/dist-web.tar.gz > ../dist/backend/dist-web.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-web-${{ needs.changes.outputs.sha }}
          path: |
            dist/backend/dist-web.tar.gz
            dist/backend/dist-web.tar.gz.sha256
          retention-days: 14

  ci:
    needs: [backend-test, frontend-test, build-backend, build-web]
    if: always()
    runs-on: ubuntu-latest
    env:
      BACKEND_TEST: ${{ needs.backend-test.result }}
      FRONTEND_TEST: ${{ needs.frontend-test.result }}
      BACKEND: ${{ needs.build-backend.result }}
      WEB: ${{ needs.build-web.result }}
    steps:
      - name: Aggregate results
        run: |
          for result in "$BACKEND_TEST" "$FRONTEND_TEST" "$BACKEND" "$WEB"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done

  release:
    needs: [changes, build-backend, build-web, ci]
    if: github.event_name == 'push' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.build-backend.result == 'success'
        with:
          name: jaz-backend-linux-x64-${{ needs.changes.outputs.sha }}
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.build-web.result == 'success'
        with:
          name: dist-web-${{ needs.changes.outputs.sha }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          assets=() components=()
          if [ -f jaz-backend-linux-x64.tar.gz ]; then
            assets+=(jaz-backend-linux-x64.tar.gz jaz-backend-linux-x64.tar.gz.sha256)
            components+=("backend linux-x64")
          fi
          if [ -f dist-web.tar.gz ]; then
            assets+=(dist-web.tar.gz dist-web.tar.gz.sha256)
            components+=("web client")
          fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no component changed, no release"
            exit 0
          fi
          notes="Components: ${components[*]}."
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="jaz-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
            since=$(gh release list --limit 30 --json tagName,createdAt --jq 'first | .createdAt // empty')
            if [ -n "$since" ]; then
              merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
                --jq "[.[] | select(.merged_at != null and .merged_at > \"$since\")] | sort_by(.number) | .[] | \"- #\(.number) \(.title)\"")
              [ -n "$merged" ] && notes="$notes"$'\n\n'"Merged since the previous release:"$'\n'"$merged"
            fi
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" 2>/dev/null \
            || gh release view "$tag" >/dev/null
          gh release upload "$tag" "${assets[@]}" --clobber
          grep . ./*.sha256 || true
