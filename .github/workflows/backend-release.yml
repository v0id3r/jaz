name: Server release

# Builds deployable artifacts of the fork:
#   - pull_request uploads them as workflow artifacts (jaz-backend-linux-x64
#     and dist-web, named with the PR head's short sha, sha256 attached,
#     retained for 14 days);
#   - a push to main releases jaz-<YYYYMMDD>-<shortsha> with only the
#     components that changed, listed in the notes;
#   - pushing a tag jaz-* releases that tag with both components.
# Only components whose sources changed are built: backend is backend/**,
# web is frontend/** minus the desktop-only parts that never enter the web
# bundle (src/main, native, electron.vite.config.ts); .github/** builds all.
# Deploys on the host download the tarballs and verify them against the
# published sha256 files instead of building locally.
on:
  push:
    branches: [main]
    tags:
      - 'jaz-*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: server-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      sha: ${{ steps.filter.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "sha=${sha::8}" | tee -a "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo backend=true | tee -a "$GITHUB_OUTPUT"
            echo web=true | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          files=$(git diff --name-only "$range")
          echo "$files"
          backend=false web=false
          if echo "$files" | grep -q '^\.github/'; then
            backend=true web=true
          else
            echo "$files" | grep -q '^backend/' && backend=true
            webfiles=$(echo "$files" | grep '^frontend/' \
              | grep -vE '^frontend/(src/main/|native/|electron\.vite\.config\.ts)' || true)
            [ -n "$webfiles" ] && web=true
          fi
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Build linux-x64 backend
        working-directory: backend
        run: |
          name="jaz-backend-linux-x64"
          out="../dist/backend/$name"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-X github.com/wins/jaz/backend/internal/buildinfo.version=jaz-${GITHUB_SHA::8}" \
            -o "$out/jaz" ./cmd/jaz
          tar -C "$out" -czf "../dist/backend/$name.tar.gz" jaz
          sha256sum "../dist/backend/$name.tar.gz" > "../dist/backend/$name.tar.gz.sha256"
          sha256sum "$out/jaz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jaz-backend-linux-x64-${{ needs.changes.outputs.sha }}
          path: |
            backend/dist/backend/jaz-backend-linux-x64.tar.gz
            backend/dist/backend/jaz-backend-linux-x64.tar.gz.sha256
          retention-days: 14

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Build web client
        working-directory: frontend
        env:
          VITE_JAZ_API_URL: origin
        run: |
          bun install --frozen-lockfile
          bun run build:web
          test -f dist-web/commit.txt
          grep -q "return window.location.origin" dist-web/assets/index-*.js
          mkdir -p ../dist/backend
          tar -C dist-web -czf ../dist/backend/dist-web.tar.gz .
          sha256sum ../dist/backend/dist-web.tar.gz > ../dist/backend/dist-web.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-web-${{ needs.changes.outputs.sha }}
          path: |
            frontend/dist/backend/dist-web.tar.gz
            frontend/dist/backend/dist-web.tar.gz.sha256
          retention-days: 14

  release:
    needs: [changes, build-backend, build-web]
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.build-backend.result == 'success'
        with:
          name: jaz-backend-linux-x64-${{ needs.changes.outputs.sha }}
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.build-web.result == 'success'
        with:
          name: dist-web-${{ needs.changes.outputs.sha }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          assets=() components=()
          if [ -f jaz-backend-linux-x64.tar.gz ]; then
            assets+=(jaz-backend-linux-x64.tar.gz jaz-backend-linux-x64.tar.gz.sha256)
            components+=("backend linux-x64")
          fi
          if [ -f dist-web.tar.gz ]; then
            assets+=(dist-web.tar.gz dist-web.tar.gz.sha256)
            components+=("web client")
          fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no component changed, no release"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes "Components: ${components[*]}."$'\n\n'"Build of commit $GITHUB_SHA." 2>/dev/null || true
          else
            tag="jaz-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
            notes="Components: ${components[*]}."$'\n\n'"Build of commit $GITHUB_SHA."
            since=$(gh release list --limit 30 --json tagName,createdAt --jq 'first | .createdAt // empty')
            if [ -n "$since" ]; then
              merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
                --jq "[.[] | select(.merged_at != null and .merged_at > \"$since\")] | sort_by(.number) | .[] | \"- #\(.number) \(.title)\"")
              [ -n "$merged" ] && notes="$notes"$'\n\n'"Merged since the previous release:"$'\n'"$merged"
            fi
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          grep . ./*.sha256 || true

  artifacts:
    needs: [build-backend, build-web]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BACKEND: ${{ needs.build-backend.result }}
      WEB: ${{ needs.build-web.result }}
    steps:
      - name: Aggregate build results
        run: |
          for result in "$BACKEND" "$WEB"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
